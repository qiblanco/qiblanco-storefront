name: Temporary Oxygen Campaign Preview

on:
  push:
    branches:
      - openclaw/hydrogen-campaign-pages-20260514

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Deploy campaign preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-preview-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-preview-${{ env.cache-name }}-
            ${{ runner.os }}-preview-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Oxygen preview
        id: deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000137303 }}
        run: |
          npx shopify hydrogen deploy \
            --preview \
            --metadata-user "OpenClaw" \
            --metadata-description "PR #4 campaign preview"

          preview_url="$(node -e "console.log(require('./h2_deploy_log.json').url)")"
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "### Oxygen Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${preview_url}" >> "$GITHUB_STEP_SUMMARY"
