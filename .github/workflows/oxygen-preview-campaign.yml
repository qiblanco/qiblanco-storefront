name: Temporary Oxygen Campaign Preview

on:
  push:
    branches:
      - openclaw/hydrogen-campaign-pages-20260514

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Deploy campaign preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-preview-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-preview-${{ env.cache-name }}-
            ${{ runner.os }}-preview-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Create preview environment file
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_ID: ${{ secrets.PUBLIC_STOREFRONT_ID }}
          PUBLIC_CHECKOUT_DOMAIN: ${{ secrets.PUBLIC_CHECKOUT_DOMAIN }}
        run: |
          {
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'PUBLIC_STOREFRONT_API_TOKEN=%s\n' "$PUBLIC_STOREFRONT_API_TOKEN"
            printf 'PUBLIC_STORE_DOMAIN=%s\n' "$PUBLIC_STORE_DOMAIN"
            printf 'PUBLIC_STOREFRONT_ID=%s\n' "$PUBLIC_STOREFRONT_ID"
            printf 'PUBLIC_CHECKOUT_DOMAIN=%s\n' "$PUBLIC_CHECKOUT_DOMAIN"
          } > .env.preview

      - name: Deploy to Oxygen preview
        id: deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000137303 }}
        run: |
          npx shopify hydrogen deploy \
            --preview \
            --env-file .env.preview \
            --force \
            --auth-bypass-token \
            --auth-bypass-token-duration 12 \
            --metadata-user "OpenClaw" \
            --metadata-description "PR #4 final campaign preview"

          preview_url="$(node -e "console.log(require('./h2_deploy_log.json').url)")"
          auth_bypass_token="$(node -e "console.log(require('./h2_deploy_log.json').authBypassToken || '')")"
          echo "Preview URL: ${preview_url}"
          echo "Auth bypass token: ${auth_bypass_token}"
          echo "preview_url=${preview_url}" >> "$GITHUB_OUTPUT"
          echo "### Oxygen Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${preview_url}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Auth bypass token: ${auth_bypass_token}" >> "$GITHUB_STEP_SUMMARY"
