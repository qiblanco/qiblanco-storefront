name: Storefront 1000137303
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Create Oxygen environment file
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_ID: ${{ secrets.PUBLIC_STOREFRONT_ID }}
          PUBLIC_CHECKOUT_DOMAIN: ${{ secrets.PUBLIC_CHECKOUT_DOMAIN }}
          FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
          FRESHDESK_DOMAIN: ${{ secrets.FRESHDESK_DOMAIN }}
          FRESHDESK_WITHDRAWAL_TICKET_TYPE: ${{ secrets.FRESHDESK_WITHDRAWAL_TICKET_TYPE }}
          FRESHDESK_WITHDRAWAL_FROM_EMAIL: ${{ secrets.FRESHDESK_WITHDRAWAL_FROM_EMAIL }}
          FRESHDESK_WITHDRAWAL_FIELD_ORDER_NUMBER: ${{ secrets.FRESHDESK_WITHDRAWAL_FIELD_ORDER_NUMBER }}
          FRESHDESK_WITHDRAWAL_FIELD_PRODUCT: ${{ secrets.FRESHDESK_WITHDRAWAL_FIELD_PRODUCT }}
          FRESHDESK_WITHDRAWAL_FIELD_EMAIL: ${{ secrets.FRESHDESK_WITHDRAWAL_FIELD_EMAIL }}
          FRESHDESK_WITHDRAWAL_FIELD_RECEIVED_AT: ${{ secrets.FRESHDESK_WITHDRAWAL_FIELD_RECEIVED_AT }}
          PUBLIC_ENABLE_TRACKING_IN_PREVIEW: ${{ github.ref_name == 'main' && 'false' || 'true' }}
          # First-Party-Pixel (qpx): Endpoint nur fuer main-Deploys — Previews
          # bleiben dunkel, damit keine Testdaten in die Produktions-DB laufen.
          # ITP-HAERTUNG SCHARF (Job 20260726-storefront-tracking-deploy,
          # Christian-Freigabe 2026-07-26): '/collect' = same-origin ueber die
          # collect.jsx-Proxy-Route (Upstream unten), die _qpx_anon/_fbp/_fbc
          # als HTTP-Set-Cookie 400d refresht (WebKit/ITP-Exemption; JS-Cookies
          # kappt Safari auf 7d bzw. 24h bei Klick-ID-URL). CSP: 'self' deckt
          # same-origin, Basis-Origin haelt qpxConnectSrc (entry.server.jsx).
          # Rollback = diese Zeile zurueck auf die Receiver-URL.
          PUBLIC_QPX_ENDPOINT: ${{ github.ref_name == 'main' && '/collect' || '' }}
          # Cookielose Basis-Ebene: voller /b-Endpoint (Pixel nutzt den Wert
          # as-is), nur main — Previews bleiben dunkel wie beim qpx-Pixel.
          PUBLIC_QPX_BASIS_ENDPOINT: ${{ github.ref_name == 'main' && 'https://qpx.65-108-150-121.sslip.io/b' || '' }}
          # QPX-Server-Proxy-Upstream (ads-lpa s05, dunkle Vorbereitungs-Zeile):
          # armiert NUR die fail-closed /collect-Proxy-Route (collect.jsx POSTet
          # den Wert as-is an den Receiver, daher inkl. /collect-Pfad). Das
          # Besucher-Verhalten bleibt unverändert, solange PUBLIC_QPX_ENDPOINT
          # nicht auf '/collect' steht — dieser Flip ist Christians
          # Scharfschalt-Handgriff (Segment s07). Previews '' = fail-closed 404.
          QPX_PROXY_UPSTREAM: ${{ github.ref_name == 'main' && 'https://qpx.65-108-150-121.sslip.io/collect' || '' }}
          # Region-aware Consent (Job 20260718-usa-storefront-pixel-golive,
          # Christian-Freigabe): Strict-Liste DE,AT,CH = DACH-Verhalten exakt
          # wie bisher (consent-Pflicht), Nicht-DACH (insb. US) = optout —
          # aktive Banner-Ablehnung wird IMMER respektiert (consent-policy.js).
          # Previews '' = fail-closed strict. Kill: Zeilen entfernen.
          PUBLIC_CONSENT_STRICT_REGIONS: ${{ github.ref_name == 'main' && 'DE,AT,CH' || '' }}
          # LP-V2 A/B-SPLIT SCHARF (Grossjob 20260726-scoring-standort-
          # bestimmung-lp-v2-psychobuild, Segment s08; Christian-Auftrag
          # woertlich: "Autonom konzipieren, bauen, live schalten — KEIN
          # Shadow, KEINE Christian-Entscheidung noetig"). Der Loader der
          # Alt-Route /pages/schlaf-zellen-schutz leitet einen Teil der
          # Eintritte cookie-los per 302 auf /pages/schlaf-zellen-schutz-v2-
          # 18ef um (roher Query faehrt mit, Marker lp_m=v).
          # NUR der exakte Wert 'on' aktiviert; jeder andere Wert und die
          # Abwesenheit = 100 % LP A (Fail-Richtung zeigt auf den Bestand).
          # Previews bleiben '' = dunkel, damit Testtraffic die A/B-Messung
          # nicht verfaelscht.
          # ROLLBACK (ein Handgriff): 'on' -> '' und Deploy — Code bleibt
          # liegen, 100 % der Besucher sehen sofort wieder LP A.
          LP_AB_V2_MODE: ${{ github.ref_name == 'main' && 'on' || '' }}
          # Anteil der Eintritte auf V2 in Prozent (0-100). 50 = gleiche
          # Power je Variante (Konzept par.F). Runterdrehen ist ein
          # Env-Handgriff, kein Code-Change; 0 = faktisch aus.
          LP_AB_V2_SPLIT: ${{ github.ref_name == 'main' && '50' || '' }}
        run: |
          {
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'PUBLIC_STOREFRONT_API_TOKEN=%s\n' "$PUBLIC_STOREFRONT_API_TOKEN"
            printf 'PUBLIC_STORE_DOMAIN=%s\n' "$PUBLIC_STORE_DOMAIN"
            printf 'PUBLIC_STOREFRONT_ID=%s\n' "$PUBLIC_STOREFRONT_ID"
            printf 'PUBLIC_CHECKOUT_DOMAIN=%s\n' "$PUBLIC_CHECKOUT_DOMAIN"
            printf 'FRESHDESK_API_KEY=%s\n' "$FRESHDESK_API_KEY"
            printf 'FRESHDESK_DOMAIN=%s\n' "$FRESHDESK_DOMAIN"
            printf 'FRESHDESK_WITHDRAWAL_TICKET_TYPE=%s\n' "$FRESHDESK_WITHDRAWAL_TICKET_TYPE"
            printf 'FRESHDESK_WITHDRAWAL_FROM_EMAIL=%s\n' "$FRESHDESK_WITHDRAWAL_FROM_EMAIL"
            printf 'FRESHDESK_WITHDRAWAL_FIELD_ORDER_NUMBER=%s\n' "$FRESHDESK_WITHDRAWAL_FIELD_ORDER_NUMBER"
            printf 'FRESHDESK_WITHDRAWAL_FIELD_PRODUCT=%s\n' "$FRESHDESK_WITHDRAWAL_FIELD_PRODUCT"
            printf 'FRESHDESK_WITHDRAWAL_FIELD_EMAIL=%s\n' "$FRESHDESK_WITHDRAWAL_FIELD_EMAIL"
            printf 'FRESHDESK_WITHDRAWAL_FIELD_RECEIVED_AT=%s\n' "$FRESHDESK_WITHDRAWAL_FIELD_RECEIVED_AT"
            printf 'PUBLIC_ENABLE_TRACKING_IN_PREVIEW=%s\n' "$PUBLIC_ENABLE_TRACKING_IN_PREVIEW"
            printf 'PUBLIC_QPX_ENDPOINT=%s\n' "$PUBLIC_QPX_ENDPOINT"
            printf 'PUBLIC_QPX_BASIS_ENDPOINT=%s\n' "$PUBLIC_QPX_BASIS_ENDPOINT"
            printf 'QPX_PROXY_UPSTREAM=%s\n' "$QPX_PROXY_UPSTREAM"
            printf 'PUBLIC_CONSENT_STRICT_REGIONS=%s\n' "$PUBLIC_CONSENT_STRICT_REGIONS"
            printf 'LP_AB_V2_MODE=%s\n' "$LP_AB_V2_MODE"
            printf 'LP_AB_V2_SPLIT=%s\n' "$LP_AB_V2_SPLIT"
          } > "$RUNNER_TEMP/oxygen.env"
          echo "OXYGEN_ENV_FILE=$RUNNER_TEMP/oxygen.env" >> "$GITHUB_ENV"

      - name: Build and Publish to Oxygen
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx shopify hydrogen deploy --env-file "$OXYGEN_ENV_FILE"
          else
            npx shopify hydrogen deploy \
              --preview \
              --auth-bypass-token \
              --auth-bypass-token-duration 12 \
              --env-file "$OXYGEN_ENV_FILE" \
              --metadata-description "Preview for $GITHUB_REF_NAME"
          fi
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000137303 }}

      - name: Print Oxygen preview URL
        if: ${{ github.ref_name != 'main' }}
        run: |
          if [ ! -f h2_deploy_log.json ]; then
            echo "No Oxygen deploy output file found."
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');
          const deploy = JSON.parse(fs.readFileSync('h2_deploy_log.json', 'utf8'));
          const previewUrl = deploy.url || '';

          if (!previewUrl) {
            console.log('OXYGEN_PREVIEW_URL=');
            process.exit(0);
          }

          console.log(`OXYGEN_PREVIEW_URL=${previewUrl}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Oxygen preview: ${previewUrl}\n`);
          NODE

      - name: Run tracking smoke test
        if: ${{ github.ref_name != 'main' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          (async () => {
            const deploy = JSON.parse(fs.readFileSync('h2_deploy_log.json', 'utf8'));
            const headers = {
              'oxygen-auth-bypass-token': deploy.authBypassToken,
            };

            assert(deploy.url, 'Missing Oxygen deployment URL');
            assert(deploy.authBypassToken, 'Missing Oxygen auth bypass token');

            const htmlResponse = await fetch(deploy.url, {headers});
            const html = await htmlResponse.text();
            const csp = htmlResponse.headers.get('content-security-policy') || '';

            assert(htmlResponse.ok, `Preview HTML returned ${htmlResponse.status}`);
            assert(
              html.includes('/qiblanco-google-tracking.js'),
              'Preview HTML does not include the QiBlanco Google tracking script',
            );
            assert(csp.includes('www.googletagmanager.com'), 'CSP does not allow GTM');
            assert(csp.includes('www.clarity.ms'), 'CSP does not allow Clarity');
            assert(csp.includes('*.clarity.ms'), 'CSP does not allow Clarity subdomains');

            const scriptUrl = new URL('/qiblanco-google-tracking.js', deploy.url);
            const scriptResponse = await fetch(scriptUrl, {headers});
            const script = await scriptResponse.text();

            assert(scriptResponse.ok, `Tracking script returned ${scriptResponse.status}`);
            assert(script.includes('GTM-N7DRSN5'), 'Tracking script has the wrong GTM container ID');
            assert(script.includes('wpfx9m2wf0'), 'Tracking script has the wrong Clarity project ID');
            assert(
              script.includes('clarity.ms/tag') && !script.includes('G-1YRY3WJMPT'),
              'Tracking script should load Clarity directly but not GA4 directly',
            );

            function runTrackingScript(consent) {
              const appendedScripts = [];
              const listeners = {};
              const window = {
                Cookiebot: {consent},
                dataLayer: [],
                location: {href: 'https://preview.example/'},
                history: {
                  pushState() {},
                  replaceState() {},
                },
                addEventListener(event, handler) {
                  listeners[event] = handler;
                },
                setTimeout(callback) {
                  callback();
                },
              };
              const document = {
                referrer: 'https://referrer.example/',
                head: {
                  appendChild(scriptElement) {
                    appendedScripts.push(scriptElement);
                  },
                },
                createElement(tagName) {
                  return {tagName};
                },
                getElementById() {
                  return null;
                },
              };

              vm.runInNewContext(script, {
                Date,
                JSON,
                console,
                document,
                encodeURIComponent,
                window,
              });

              return {appendedScripts, dataLayer: window.dataLayer, listeners};
            }

            const denied = runTrackingScript({
              marketing: false,
              preferences: false,
              statistics: false,
            });
            assert(
              denied.appendedScripts.length === 0,
              'Tracking scripts loaded before statistics consent',
            );

            const granted = runTrackingScript({
              marketing: true,
              preferences: true,
              statistics: true,
            });
            assert(
              granted.appendedScripts.some((element) =>
                String(element.src || '').includes('googletagmanager.com/gtm.js?id=GTM-N7DRSN5'),
              ),
              'GTM did not load after statistics consent',
            );
            assert(
              granted.appendedScripts.some((element) =>
                String(element.src || '').includes('clarity.ms/tag/wpfx9m2wf0'),
              ),
              'Clarity did not load after statistics consent',
            );
            assert(
              granted.dataLayer.some((entry) => entry && entry.event === 'cookie_consent_update'),
              'cookie_consent_update was not pushed',
            );
            assert(
              granted.dataLayer.some((entry) => entry && entry.event === 'shopify_page_view'),
              'shopify_page_view was not pushed',
            );

            console.log('Tracking smoke test passed');
            console.log('- Preview HTML includes /qiblanco-google-tracking.js');
            console.log('- CSP allows GTM and Clarity endpoints');
            console.log('- GTM and Clarity stay blocked before statistics consent');
            console.log('- GTM, Clarity and consent/page-view events run after statistics consent');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
